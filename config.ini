# Remote AI Agent Workflow - Configuration

[server]
host = "0.0.0.0"
port = 8080
workers = 4
reload = false
max_command_duration = 300
rate_limit_per_min = 60

[security]
api_key_required = true
jwt_secret = "CHANGE_ME_IN_PRODUCTION"
jwt_algorithm = "HS256"
jwt_expiration_hours = 24
command_whitelist = []
command_blacklist = ["rm -rf /", "mkfs", "dd if=", "> /dev/sda", "shutdown", "reboot", "init 0", "init 6"]
allow_command_echo = true
max_output_size_kb = 1024

[tunnel]
provider = "ngrok"  # ngrok | ssh | none
ngrok_auth_token = ""
ngrok_region = "us"
ssh_host = ""
ssh_port = 22
ssh_user = ""
ssh_key_path = ""
ssh_remote_port = 8080

[llm]
default_provider = "ollama"
ollama_host = "http://127.0.0.1:11434"
ollama_model = "llama3.2:3b"
openai_api_key = ""
openai_model = "gpt-4o-mini"
openrouter_api_key = ""
openrouter_model = "meta-llama/llama-3.1-8b-instruct:free"
max_tokens = 2048
temperature = 0.7

[database]
path = "agent_workflow.db"
backup_interval_hours = 24

[logging]
level = "INFO"
file = "agent_workflow.log"
max_size_mb = 100
backup_count = 5

[ui]
theme = "dark"
refresh_interval_ms = 2000
max_command_history = 100
