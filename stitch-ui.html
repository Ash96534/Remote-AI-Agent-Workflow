<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote AI Agent Workflow — Stitch UI</title>
<style>
/* Stitch Design System — Google Stitch Inspired */
:root {
  --stitch-bg: #0a0a0a;
  --stitch-surface: #131313;
  --stitch-elevated: #1c1c1c;
  --stitch-border: #2a2a2a;
  --stitch-text: #eaeaea;
  --stitch-text-muted: #8a8a8a;
  --stitch-accent: #3b82f6;
  --stitch-accent-hover: #2563eb;
  --stitch-success: #22c55e;
  --stitch-warning: #f59e0b;
  --stitch-error: #ef4444;
  --stitch-shadow: 0 4px 20px rgba(0,0,0,0.4);
  --stitch-radius: 12px;
  --stitch-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--stitch-bg);
  color: var(--stitch-text);
  min-height: 100vh;
  padding: 0;
  line-height: 1.5;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--stitch-border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.logo-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--stitch-accent), #8b5cf6);
  border-radius: var(--stitch-radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.25rem;
  color: #fff;
  box-shadow: var(--stitch-shadow);
}

.logo-text {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.header-actions {
  display: flex;
  gap: 0.75rem;
  align-items: center;
}

/* Status Pill */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 600;
  border: 1px solid transparent;
}

.status-badge.online {
  background: rgba(34, 197, 94, 0.1);
  color: var(--stitch-success);
  border-color: rgba(34, 197, 94, 0.3);
}

.status-badge.offline {
  background: rgba(239, 68, 68, 0.1);
  color: var(--stitch-error);
  border-color: rgba(239, 68, 68, 0.3);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}

.status-badge.online .status-dot {
  box-shadow: 0 0 8px var(--stitch-success);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Alerts */
.alert {
  padding: 1rem 1.25rem;
  border-radius: var(--stitch-radius);
  margin-bottom: 1.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  animation: slideIn 0.3s ease;
}

.alert.error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--stitch-error);
}

.alert.success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: var(--stitch-success);
}

@keyframes slideIn {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Grid Layout */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

@media (max-width: 1024px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .grid, .grid-2 { grid-template-columns: 1fr; }
}

/* Cards — Stitch Glassmorphism */
.card {
  background: var(--stitch-surface);
  border: 1px solid var(--stitch-border);
  border-radius: var(--stitch-radius);
  padding: 1.5rem;
  box-shadow: var(--stitch-shadow);
  backdrop-filter: blur(12px);
  transition: var(--stitch-transition);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--stitch-accent), transparent);
  opacity: 0.5;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(59, 130, 246, 0.3);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.card h2 {
  font-size: 0.875rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  color: var(--stitch-text-muted);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.card-icon {
  width: 20px;
  height: 20px;
  background: rgba(59, 130, 246, 0.1);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--stitch-accent);
  font-size: 0.875rem;
}

/* Inputs & Selects */
.input-group {
  margin-bottom: 1rem;
}

.input-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--stitch-text-muted);
  margin-bottom: 0.5rem;
}

.input-field {
  width: 100%;
  background: var(--stitch-bg);
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
  padding: 0.875rem 1rem;
  color: var(--stitch-text);
  font-size: 0.9375rem;
  font-family: inherit;
  transition: var(--stitch-transition);
}

.input-field::placeholder {
  color: var(--stitch-text-muted);
}

.input-field:focus {
  outline: none;
  border-color: var(--stitch-accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.input-field.readonly {
  background: var(--stitch-elevated);
  cursor: not-allowed;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  border-radius: 0.75rem;
  border: none;
  font-size: 0.9375rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--stitch-transition);
}

.btn-primary {
  background: linear-gradient(135deg, var(--stitch-accent), var(--stitch-accent-hover));
  color: #fff;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-secondary {
  background: var(--stitch-elevated);
  color: var(--stitch-text);
  border: 1px solid var(--stitch-border);
}

.btn-secondary:hover {
  background: #262626;
  border-color: #444;
}

.btn-danger {
  background: rgba(239, 68, 68, 0.1);
  color: var(--stitch-error);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: var(--stitch-error);
}

.btn-group {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

/* Textareas */
.textarea {
  width: 100%;
  background: var(--stitch-bg);
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
  padding: 1rem;
  color: var(--stitch-text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.875rem;
  resize: vertical;
  min-height: 140px;
  transition: var(--stitch-transition);
}

.textarea:focus {
  outline: none;
  border-color: var(--stitch-accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

/* Output Area */
.output-area {
  background: #050505;
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
  padding: 1rem;
  color: #4ade80;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.8125rem;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 300px;
  overflow-y: auto;
  line-height: 1.6;
}

/* Tunnel URL */
.tunnel-url {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  color: var(--stitch-accent);
  word-break: break-all;
  font-size: 0.875rem;
}

/* History List */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.history-item {
  background: var(--stitch-bg);
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
  padding: 1rem;
  transition: var(--stitch-transition);
}

.history-item:hover {
  border-color: rgba(59, 130, 246, 0.2);
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}

.history-time {
  font-size: 0.75rem;
  color: var(--stitch-text-muted);
}

.history-status {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
}

.history-status.completed {
  background: rgba(34, 197, 94, 0.1);
  color: var(--stitch-success);
  border: 1px solid rgba(34, 197, 94, 0.2);
}

.history-status.failed,
.history-status.error,
.history-status.timeout,
.history-status.rejected {
  background: rgba(239, 68, 68, 0.1);
  color: var(--stitch-error);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.history-status.running {
  background: rgba(245, 158, 11, 0.1);
  color: var(--stitch-warning);
  border: 1px solid rgba(245, 158, 11, 0.2);
}

.history-command {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.875rem;
  color: var(--stitch-text);
  margin-bottom: 0.5rem;
  white-space: pre-wrap;
}

.history-output {
  font-size: 0.8125rem;
  color: var(--stitch-text-muted);
  white-space: pre-wrap;
  max-height: 60px;
  overflow-y: auto;
}

.history-error {
  font-size: 0.8125rem;
  color: var(--stitch-error);
  white-space: pre-wrap;
  margin-top: 0.5rem;
}

/* Provider Select */
.provider-select {
  width: 100%;
  background: var(--stitch-bg);
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
  padding: 0.875rem 1rem;
  color: var(--stitch-text);
  font-size: 0.9375rem;
  transition: var(--stitch-transition);
}

.provider-select:focus {
  outline: none;
  border-color: var(--stitch-accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 2rem;
  color: var(--stitch-text-muted);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 1rem;
  color: var(--stitch-text-muted);
}

/* Tunnel Card */
.tunnel-info {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--stitch-bg);
  border: 1px solid var(--stitch-border);
  border-radius: 0.75rem;
}

.tunnel-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--stitch-text-muted);
  margin-bottom: 0.5rem;
}

/* Animations */
@keyframes slideIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.card {
  animation: slideIn 0.4s ease forwards;
}

.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
.card:nth-child(4) { animation-delay: 0.4s; }

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--stitch-bg);
}

::-webkit-scrollbar-thumb {
  background: var(--stitch-border);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #444;
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">
<div class="logo-icon">AI</div>
<div class="logo-text">Remote AI Agent Workflow</div>
</div>
<div class="header-actions">
<span class="status-badge online" id="statusBadge">
<span class="status-dot"></span>
<span id="statusText">Online</span>
</span>
<span id="tunnelUrl" class="tunnel-url"></span>
</div>
</header>

<div id="alertArea"></div>

<div class="grid">
<div class="card">
<h2><span class="card-icon">🔐</span>Authentication</h2>
<div class="input-group">
<label class="input-label">Session Token</label>
<input type="text" id="tokenInput" class="input-field readonly" placeholder="No token — click Get Token" readonly>
</div>
<div class="btn-group" style="margin-top:0.5rem;">
<button class="btn btn-primary" onclick="getToken()">Get Token</button>
</div>
<p style="margin-top:1rem; font-size:0.8rem; color:var(--stitch-text-muted);">Use the token as a Bearer header in API calls, or paste it below for the UI.</p>
<div class="input-group" style="margin-top:1rem;">
<label class="input-label">UI Token (paste for commands)</label>
<input type="text" id="uiToken" class="input-field" placeholder="Paste token here...">
</div>
</div>

<div class="card">
<h2><span class="card-icon">🌐</span>Tunnel</h2>
<div class="btn-group">
<button class="btn btn-primary" onclick="startTunnel()">Start Tunnel</button>
<button class="btn btn-secondary" onclick="stopTunnel()">Stop Tunnel</button>
<button class="btn btn-secondary" onclick="refreshTunnel()">Refresh</button>
</div>
<div class="tunnel-info">
<div class="tunnel-label" id="tunnelLabel">Tunnel Status</div>
<div id="tunnelInfo" style="font-size:0.875rem; color:var(--stitch-text-muted);">Checking tunnel...</div>
</div>
</div>
</div>

<div class="grid-2">
<div class="card" style="grid-column: span 2;">
<h2><span class="card-icon">💻</span>Command Execution</h2>
<textarea id="cmdInput" class="textarea" placeholder="e.g. ls -la, pwd, whoami, curl ..."></textarea>
<div class="btn-group" style="margin-top:1rem;">
<button class="btn btn-primary" onclick="runCommand()">Run Command</button>
<button class="btn btn-secondary" onclick="clearOutput()">Clear Output</button>
</div>
<div id="cmdOutput" class="output-area"></div>
</div>
</div>

<div class="grid">
<div class="card">
<h2><span class="card-icon">🤖</span>AI Chat</h2>
<textarea id="chatInput" class="textarea" placeholder="Ask the agent to explain, write code, or analyze..."></textarea>
<div style="margin-top:1rem; display:flex; gap:0.75rem; align-items:center;">
<label class="input-label" style="margin-bottom:0; margin-right:0.5rem;">Provider:</label>
<select id="llmProvider" class="provider-select">
<option value="ollama">Ollama (Local)</option>
<option value="openai">OpenAI</option>
<option value="openrouter">OpenRouter</option>
</select>
<button class="btn btn-primary" onclick="chatLLM()">Ask</button>
</div>
<div id="chatOutput" class="output-area" style="margin-top:1rem;"></div>
</div>

<div class="card">
<h2><span class="card-icon">📜</span>Command History</h2>
<div id="historyList" class="history-list"></div>
<button class="btn btn-secondary" style="margin-top:1rem; width:100%;" onclick="loadHistory()">Refresh History</button>
</div>
</div>
</div>

<script>
let token = localStorage.getItem("aia_token") || "";
const uiTokenInput = document.getElementById("uiToken");
uiTokenInput.value = token;
document.getElementById("tokenInput").value = token;

function showAlert(msg, type = "error") {
  const area = document.getElementById("alertArea");
  area.innerHTML = `<div class="alert ${type}">${escapeHtml(msg)}</div>`;
  setTimeout(() => { area.innerHTML = ""; }, 5000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&#39;", "'": "&#39;" })[c]);
}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...opts.headers };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch("http://localhost:8080" + path, { ...opts, headers });
  if (res.status === 401) {
    showAlert("Session expired. Get a new token.");
    token = "";
    localStorage.removeItem("aia_token");
    uiTokenInput.value = "";
    document.getElementById("tokenInput").value = "";
  }
  return res;
}

async function getToken() {
  const res = await api("/auth/token", { method: "POST" });
  const data = await res.json();
  if (data.access_token) {
    token = data.access_token;
    localStorage.setItem("aia_token", token);
    uiTokenInput.value = token;
    document.getElementById("tokenInput").value = token;
    showAlert("Token obtained successfully.", "success");
  } else {
    showAlert("Failed to get token.");
  }
}

async function refreshTunnel() {
  const res = await api("/tunnel/status");
  const data = await res.json();
  const info = document.getElementById("tunnelInfo");
  const urlEl = document.getElementById("tunnelUrl");
  const badge = document.getElementById("statusBadge");
  const badgeText = document.getElementById("statusText");
  if (data.active) {
    info.textContent = "Active — " + data.public_url;
    urlEl.textContent = data.public_url;
    badge.className = "status-badge online";
    badgeText.textContent = "Online";
    showAlert("Tunnel: " + data.public_url, "success");
  } else {
    info.textContent = "Inactive";
    urlEl.textContent = "";
    badge.className = "status-badge offline";
    badgeText.textContent = "Offline";
  }
}

async function startTunnel() {
  const res = await api("/tunnel/start", { method: "POST" });
  if (res.ok) {
    const data = await res.json();
    showAlert("Tunnel started: " + data.public_url, "success");
    refreshTunnel();
  } else {
    const err = await res.json();
    showAlert("Failed to start tunnel: " + (err.detail || "unknown error"));
  }
}

async function stopTunnel() {
  const res = await api("/tunnel/stop", { method: "POST" });
  if (res.ok) {
    showAlert("Tunnel stopped.", "success");
    refreshTunnel();
  } else {
    showAlert("Failed to stop tunnel.");
  }
}

async function runCommand() {
  const input = document.getElementById("cmdInput");
  const out = document.getElementById("cmdOutput");
  const cmd = input.value.trim();
  if (!cmd) return;
  out.textContent = "Running…";
  const uiTok = uiTokenInput.value || token;
  const res = await fetch("http://localhost:8080/command", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + uiTok },
    body: JSON.stringify({ command: cmd }),
  });
  const data = await res.json();
  if (data.error) out.textContent = "ERROR: " + data.error;
  else if (data.output !== undefined && data.output !== null) out.textContent = data.output;
  else out.textContent = JSON.stringify(data, null, 2);
  loadHistory();
}

async function chatLLM() {
  const input = document.getElementById("chatInput");
  const out = document.getElementById("chatOutput");
  const prompt = input.value.trim();
  if (!prompt) return;
  out.textContent = "Thinking…";
  const uiTok = uiTokenInput.value || token;
  const provider = document.getElementById("llmProvider").value;
  const res = await fetch("http://localhost:8080/llm/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + uiTok },
    body: JSON.stringify({ prompt, provider }),
  });
  const data = await res.json();
  out.textContent = data.response || JSON.stringify(data, null, 2);
}

async function loadHistory() {
  const uiTok = uiTokenInput.value || token;
  const res = await fetch("http://localhost:8080/history?limit=20", {
    headers: { "Authorization": "Bearer " + uiTok },
  });
  if (!res.ok) {
    document.getElementById("historyList").innerHTML = "<div class='empty-state'>Unable to load history.</div>";
    return;
  }
  const rows = await res.json();
  const el = document.getElementById("historyList");
  if (!rows.length) {
    el.innerHTML = "<div class='empty-state'><svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12h6m-6 4h6m2-5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg><p style='margin-top:1rem;'>No commands yet.</p></div>";
    return;
  }
  el.innerHTML = rows.map(r => `
    <div class="history-item">
      <div class="history-header">
        <span class="history-time">${new Date(r.created_at * 1000).toLocaleString()}</span>
        <span class="history-status ${r.status}">${r.status}</span>
      </div>
      <div class="history-command">${escapeHtml(r.command)}</div>
      ${r.output ? `<div class="history-output">${escapeHtml(r.output).slice(0,300)}</div>` : ""}
      ${r.error ? `<div class="history-error">${escapeHtml(r.error)}</div>` : ""}
    </div>
  `).join("");
}

function clearOutput() { document.getElementById("cmdOutput").textContent = ""; }

document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatLLM(); } });
document.getElementById("cmdInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runCommand(); } });

refreshTunnel();
loadHistory();
</script>
</body>
</html>
